<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор промісів - Lab 7</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/izitoast/dist/css/iziToast.min.css">
    <link rel="icon" type="image/x-icon" href="../lab1/images/favicon.ico">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <a href="index.html" class="nav-logo">← Назад до завдань</a>
                <div class="nav-links">
                    <a href="../../" class="nav-link">Головна</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="hero" style="padding: 2rem 0;">
        <div class="container">
            <div class="hero-content">
                <h1 class="hero-title" style="font-size: 2rem; margin-bottom: 0.5rem;">Генератор промісів</h1>
                <p class="hero-subtitle" style="font-size: 1rem;">Створення промісів з заданою затримкою та станом</p>
            </div>
        </div>
    </section>

    <section class="tasks-section">
        <div class="container">
            <form class="promise-form">
                <div class="form-group">
                    <label class="form-label" for="delay">Delay (ms)</label>
                    <input 
                        type="number" 
                        id="delay" 
                        name="delay" 
                        class="form-input" 
                        placeholder="1000"
                        min="0"
                        step="100"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label class="form-label">State</label>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="state" value="fulfilled" checked>
                            Fulfilled
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="state" value="rejected">
                            Rejected
                        </label>
                    </div>
                </div>
                
                <button type="submit" class="form-button">Create notification</button>
            </form>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p class="footer-text">© 2025 Штифлюк Ольга, ІО-31. Lab 7 - Promise</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/izitoast/dist/js/iziToast.min.js"></script>
    <script src="promise.js"></script>
</body>
</html>
