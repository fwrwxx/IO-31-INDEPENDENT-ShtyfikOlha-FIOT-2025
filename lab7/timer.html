<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таймер зворотного відліку - Lab 7</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/izitoast/dist/css/iziToast.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <a href="index.html" class="nav-logo">← Назад до завдань</a>
                <div class="nav-links">
                    <a href="../../" class="nav-link">Головна</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="hero" style="padding: 2rem 0;">
        <div class="container">
            <div class="hero-content">
                <h1 class="hero-title" style="font-size: 2rem; margin-bottom: 0.5rem;">Таймер зворотного відліку</h1>
                <p class="hero-subtitle" style="font-size: 1rem;">Виберіть дату в майбутньому та запустіть таймер</p>
            </div>
        </div>
    </section>

    <section class="tasks-section">
        <div class="container">
            <div class="timer-container">
                <div class="timer-controls">
                    <input type="text" id="datetime-picker" class="timer-input" placeholder="Виберіть дату та час">
                    <button type="button" id="start-btn" class="timer-button" disabled>Start</button>
                </div>
                
                <div class="timer-display">
                    <div class="timer-field">
                        <span class="timer-value" data-days>00</span>
                        <span class="timer-label">Days</span>
                    </div>
                    <div class="timer-field">
                        <span class="timer-value" data-hours>00</span>
                        <span class="timer-label">Hours</span>
                    </div>
                    <div class="timer-field">
                        <span class="timer-value" data-minutes>00</span>
                        <span class="timer-label">Minutes</span>
                    </div>
                    <div class="timer-field">
                        <span class="timer-value" data-seconds>00</span>
                        <span class="timer-label">Seconds</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p class="footer-text">© 2025 Штифлюк Ольга, ІО-31. Lab 7 - Timer</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/izitoast/dist/js/iziToast.min.js"></script>
    <script src="timer.js"></script>
</body>
</html>
