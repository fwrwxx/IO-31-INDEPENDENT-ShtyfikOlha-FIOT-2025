<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пошук зображень - Lab 7</title>
    <link rel="stylesheet" href="gallery.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/izitoast/dist/css/iziToast.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/simplelightbox/2.14.2/simple-lightbox.min.css">
    <link rel="icon" type="image/x-icon" href="../lab1/images/favicon.ico">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-content">
                <a href="../index.html" class="nav-logo">← Назад до завдань</a>
                <div class="nav-links">
                    <a href="../../" class="nav-link">Головна</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <h1 class="hero-title">Пошук зображень</h1>
                <p class="hero-subtitle">Знайдіть красиві зображення за ключовим словом</p>
            </div>
        </div>
    </section>

    <section class="search-section">
        <div class="container">
            <form class="search-form" id="searchForm">
                <div class="search-wrapper">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M9 17A8 8 0 1 0 9 1a8 8 0 0 0 0 16zM19 19l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <input 
                        type="text" 
                        id="searchInput" 
                        name="query" 
                        class="search-input" 
                        placeholder="Наприклад: nature, cats, sunset, coffee..."
                        required
                    >
                    <button type="submit" class="search-button">Знайти</button>
                </div>
            </form>

            <div class="loader" id="loader" style="display: none;">
                <div class="spinner"></div>
            </div>

            <ul class="gallery" id="gallery"></ul>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p class="footer-text">© 2025 Штифлюк Ольга, ІО-31. Lab 7 - Image Search</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/izitoast/dist/js/iziToast.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplelightbox/2.14.2/simple-lightbox.min.js"></script>
    <script src="gallery.js"></script>
</body>
</html>
